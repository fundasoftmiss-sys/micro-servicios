# ===== Tienda Monolito =====
spring.application.name=tienda-monolito
server.port=8080

# UNA sola base de datos para todos los modulos (productos, clientes, pedidos)
spring.datasource.url=jdbc:h2:mem:tiendadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:tiendadb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
