# ===== ms-pedidos (antes tienda-monolito) =====
spring.application.name=ms-pedidos
server.port=8080

# BASE DE DATOS PROPIA: solo la tabla PEDIDO.
# Ya no hay llaves foraneas a CLIENTE ni a PRODUCTO: viven en otras bases.
spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:pedidosdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Donde viven los otros servicios =====
servicios.productos.url=http://localhost:8081
servicios.clientes.url=http://localhost:8082

# ===== Timeouts: en el monolito esto no existia =====
# Sin ellos, una llamada lenta a otro servicio deja colgado un hilo de este.
servicios.timeout.conexion-ms=2000
servicios.timeout.lectura-ms=3000

# Datos de ejemplo al arrancar (necesita los otros dos servicios levantados)
datos.iniciales=true
